name: Update Weekly Matchups Data
on:
  schedule:
    - cron: '0 8 * * 2,4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests nfl_data_py pandas
      - run: python scripts/build_matchups.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matchups.json
          git diff --staged --quiet || git commit -m "chore: update weekly matchups.json"
          git push
