<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Capital War Chest · Dynasty Desk Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 850: '#151e2e', 900: '#0f172a', 950: '#090d16' } } } } }</script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">
<script src="dynasty-core.js"></script>
<script src="dynasty-nav.js"></script>

<header class="bg-slate-900 border-b border-slate-800 px-4 py-3">
  <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="font-bold text-lg text-white">Draft Capital &amp; Future Pick War Chest</h1>
      <p class="text-xs text-slate-400">Tracks every traded pick across 3 years, priced with live FantasyCalc Early/Mid/Late pick curves.</p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <input id="user" placeholder="Sleeper username" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white w-36 sm:w-44">
      <select id="season" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm text-white"></select>
      <button id="go" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-4 py-1.5 rounded-lg cursor-pointer">Load Picks</button>
      <select id="league" hidden class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-emerald-300 max-w-[210px] truncate"></select>
    </div>
  </div>
  <div id="status" class="max-w-7xl mx-auto text-xs text-slate-400 mt-2">Ready.</div>
</header>

<main id="main" hidden class="max-w-7xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
  <div id="leaderboard" class="space-y-3"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const { SL, esc, j, getSavedState, saveState, loadMarket, resolveUserAndLeagues } = DD;

const curYr = new Date().getFullYear();
for (let y = curYr; y >= curYr - 3; y--) $("season").add(new Option(y, y));
const saved = getSavedState();
if (saved.user) $("user").value = saved.user;
if (saved.season) $("season").value = saved.season;

$("go").onclick = async () => {
  try {
    const uname = $("user").value.trim();
    if (!uname) return $("status").textContent = "Enter a Sleeper username.";
    saveState({ user: uname, season: $("season").value });
    $("status").textContent = "Fetching leagues...";
    const { user, leagues } = await resolveUserAndLeagues(uname, $("season").value);
    const sel = $("league"); sel.innerHTML = ""; sel.hidden = false;
    leagues.forEach((l, i) => sel.add(new Option(l.name, i)));
    const idx = leagues.findIndex(l => String(l.league_id) === String(saved.leagueId));
    if (idx >= 0) sel.value = idx;
    sel.onchange = () => renderPicks(leagues[sel.value], user.user_id);
    await renderPicks(leagues[sel.value || 0], user.user_id);
  } catch (e) { $("status").textContent = "Error: " + e.message; }
};

async function renderPicks(lg, uid) {
  saveState({ leagueId: lg.league_id });
  $("status").textContent = "Pricing all future picks with live FantasyCalc market values...";
  const [market, rosters, users, traded] = await Promise.all([
    loadMarket(lg, msg => $("status").textContent = msg),
    j(`${SL}/league/${lg.league_id}/rosters`),
    j(`${SL}/league/${lg.league_id}/users`),
    j(`${SL}/league/${lg.league_id}/traded_picks`)
  ]);

  const tname = rid => {
    const r = rosters.find(x => x.roster_id === rid);
    const u = users.find(x => x.user_id === r?.owner_id);
    return u?.metadata?.team_name || u?.display_name || "Team " + rid;
  };

  const ordered = [...rosters].sort((a, b) => (a.settings.wins - b.settings.wins) || (a.settings.fpts - b.settings.fpts));
  const tierFor = rid => {
    const idx = ordered.findIndex(r => r.roster_id === rid);
    const pct = idx / Math.max(1, ordered.length - 1);
    return pct <= 0.33 ? "Early" : pct <= 0.67 ? "Mid" : "Late";
  };

  const baseYr = Number(lg.season);
  const years = [baseYr + 1, baseYr + 2, baseYr + 3];

  const teams = rosters.map(r => {
    const picks = [];
    years.forEach(yr => {
      for (let rd = 1; rd <= 4; rd++) {
        rosters.forEach(orig => {
          const tr = traded.find(t => String(t.season) === String(yr) && t.round === rd && t.roster_id === orig.roster_id);
          const ownerRid = tr ? tr.owner_id : orig.roster_id;
          if (ownerRid === r.roster_id) {
            const tier = tierFor(orig.roster_id);
            const val = market.pickValue(yr, rd, tier);
            const via = orig.roster_id !== r.roster_id ? ` via ${tname(orig.roster_id)}` : "";
            picks.push({ label: `${yr} ${tier} ${rd}${rd === 1 ? "st" : rd === 2 ? "nd" : rd === 3 ? "rd" : "th"}${via}`, val, rd });
          }
        });
      }
    });
    picks.sort((a, b) => b.val - a.val);
    const total = picks.reduce((s, p) => s + p.val, 0);
    const firsts = picks.filter(p => p.rd === 1).length;
    return { rid: r.roster_id, ownerId: r.owner_id, name: tname(r.roster_id), picks, total, firsts };
  }).sort((a, b) => b.total - a.total);

  $("leaderboard").innerHTML = teams.map((t, i) => `
    <div class="bg-slate-900 border ${t.ownerId === uid ? "border-emerald-500/50" : "border-slate-800"} rounded-xl p-4">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
        <div>
          <span class="font-mono font-bold text-slate-400 mr-2">#${i + 1}</span>
          <span class="font-bold text-white text-base">${esc(t.name)}</span>
          <span class="ml-2 text-xs bg-purple-500/15 text-purple-300 px-2 py-0.5 rounded font-semibold">${t.firsts} First(s)</span>
        </div>
        <div class="font-mono font-extrabold text-emerald-400 text-lg">${t.total.toLocaleString()} pts</div>
      </div>
      <div class="flex flex-wrap gap-1.5">
        ${t.picks.map(p => `<span class="text-xs bg-slate-950 border border-slate-800 px-2.5 py-1 rounded-lg text-slate-300">${esc(p.label)} <b class="text-emerald-400 ml-1">${p.val.toLocaleString()}</b></span>`).join("") || `<span class="text-xs text-slate-500">No picks owned</span>`}
      </div>
    </div>`).join("");

  $("main").hidden = false;
  $("status").textContent = `Ranked draft capital for ${teams.length} teams in ${lg.name}.`;
}

if ($("user").value) $("go").click();
</script>
</body>
</html>
