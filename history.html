<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Franchise History &amp; Records · Dynasty Desk Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 850: '#151e2e', 900: '#0f172a', 950: '#090d16' } } } } }</script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">
<script src="dynasty-core.js"></script>
<script src="dynasty-nav.js"></script>

<header class="bg-slate-900 border-b border-slate-800 px-4 py-3">
  <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="font-bold text-lg text-white">All-Time Franchise History &amp; Trophy Case</h1>
      <p class="text-xs text-slate-400">Walks backward through every linked Sleeper league season for career records, titles &amp; H2H rivalries.</p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <input id="user" placeholder="Sleeper username" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white w-36 sm:w-44">
      <select id="season" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm text-white"></select>
      <button id="go" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-4 py-1.5 rounded-lg cursor-pointer">Load History</button>
      <select id="league" hidden class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-emerald-300 max-w-[210px] truncate"></select>
    </div>
  </div>
  <div id="status" class="max-w-7xl mx-auto text-xs text-slate-400 mt-2">Ready.</div>
</header>

<main id="main" hidden class="max-w-7xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
  <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
    <h2 class="text-base font-bold text-white mb-3">🏆 Championship Trophy Case</h2>
    <div id="trophies" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3"></div>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 overflow-x-auto">
    <h2 class="text-base font-bold text-white mb-3">📈 All-Time Franchise Standings</h2>
    <table class="w-full text-left border-collapse text-sm">
      <thead>
        <tr class="border-b border-slate-800 text-xs text-slate-400 uppercase">
          <th class="py-2.5 px-3">Manager</th>
          <th class="py-2.5 px-3">Seasons</th>
          <th class="py-2.5 px-3">Career W-L</th>
          <th class="py-2.5 px-3">Win %</th>
          <th class="py-2.5 px-3">Titles</th>
          <th class="py-2.5 px-3">Total Points</th>
        </tr>
      </thead>
      <tbody id="careerBody" class="divide-y divide-slate-800/70"></tbody>
    </table>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const { SL, esc, j, getSavedState, saveState, resolveUserAndLeagues } = DD;

const curYr = new Date().getFullYear();
for (let y = curYr; y >= curYr - 3; y--) $("season").add(new Option(y, y));
const saved = getSavedState();
if (saved.user) $("user").value = saved.user;
if (saved.season) $("season").value = saved.season;

$("go").onclick = async () => {
  try {
    const uname = $("user").value.trim();
    if (!uname) return $("status").textContent = "Enter a Sleeper username.";
    saveState({ user: uname, season: $("season").value });
    $("status").textContent = "Fetching leagues...";
    const { leagues } = await resolveUserAndLeagues(uname, $("season").value);
    const sel = $("league"); sel.innerHTML = ""; sel.hidden = false;
    leagues.forEach((l, i) => sel.add(new Option(l.name, i)));
    const idx = leagues.findIndex(l => String(l.league_id) === String(saved.leagueId));
    if (idx >= 0) sel.value = idx;
    sel.onchange = () => loadHistory(leagues[sel.value]);
    await loadHistory(leagues[sel.value || 0]);
  } catch (e) { $("status").textContent = "Error: " + e.message; }
};

async function loadHistory(startLg) {
  saveState({ leagueId: startLg.league_id });
  $("status").textContent = "Tracing previous_league_id chain across seasons...";
  const chain = [];
  let cur = startLg;
  while (cur && chain.length < 12) {
    chain.push(cur);
    if (!cur.previous_league_id || cur.previous_league_id === "0") break;
    cur = await j(`${SL}/league/${cur.previous_league_id}`).catch(() => null);
  }

  const career = {};
  const champs = [];

  for (const lg of chain) {
    const [rosters, users, winners] = await Promise.all([
      j(`${SL}/league/${lg.league_id}/rosters`),
      j(`${SL}/league/${lg.league_id}/users`),
      j(`${SL}/league/${lg.league_id}/winners_bracket`).catch(() => [])
    ]);

    const nameOf = uid => {
      const u = users.find(x => x.user_id === uid);
      return u?.display_name || u?.metadata?.team_name || uid || "Unknown";
    };

    const finalMatch = winners.find(m => m.p === 1 && m.w);
    const champRid = finalMatch?.w;
    let champName = "In Progress";

    rosters.forEach(r => {
      if (!r.owner_id) return;
      const nm = nameOf(r.owner_id);
      if (!career[r.owner_id]) career[r.owner_id] = { name: nm, seasons: 0, w: 0, l: 0, pts: 0, titles: 0 };
      career[r.owner_id].name = nm;
      career[r.owner_id].seasons++;
      career[r.owner_id].w += r.settings.wins || 0;
      career[r.owner_id].l += r.settings.losses || 0;
      career[r.owner_id].pts += r.settings.fpts || 0;
      if (r.roster_id === champRid) {
        career[r.owner_id].titles++;
        champName = nm;
      }
    });

    champs.push({ season: lg.season, champ: champName });
  }

  $("trophies").innerHTML = champs.map(c => `
    <div class="bg-slate-950 border border-amber-500/30 rounded-xl p-3.5">
      <div class="text-xs font-bold text-amber-400">${c.season} Season</div>
      <div class="text-base font-extrabold text-white mt-1">🏆 ${esc(c.champ)}</div>
    </div>`).join("");

  $("careerBody").innerHTML = Object.values(career)
    .sort((a, b) => (b.titles - a.titles) || (b.w - a.w))
    .map(c => {
      const pct = (c.w + c.l) ? ((c.w / (c.w + c.l)) * 100).toFixed(1) : "0.0";
      return `
        <tr class="hover:bg-slate-800/40">
          <td class="py-2.5 px-3 font-bold text-white">${esc(c.name)}</td>
          <td class="py-2.5 px-3 font-mono text-slate-400">${c.seasons}</td>
          <td class="py-2.5 px-3 font-mono">${c.w}-${c.l}</td>
          <td class="py-2.5 px-3 font-mono text-emerald-400">${pct}%</td>
          <td class="py-2.5 px-3 font-bold text-amber-400">${c.titles ? "🏆 ".repeat(c.titles) : "—"}</td>
          <td class="py-2.5 px-3 font-mono text-slate-300">${c.pts.toFixed(1)}</td>
        </tr>`;
    }).join("");

  $("main").hidden = false;
  $("status").textContent = `Loaded ${chain.length} season(s) of league history.`;
}

if ($("user").value) $("go").click();
</script>
</body>
</html>
